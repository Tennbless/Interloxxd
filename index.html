<p><label style="display:inline;font-size:14px;color:var(--tx)"><input type="checkbox" id="p_ok" style="width:auto"> I certify the information is accurate and consent to verification.</label></p>
<button onclick="subP('${sid}')">${sid=='admin'?'Save application to records':'Submit to administrator'}</button></div>`}
async function subP(sid){const f={name:val('p_name'),email:val('p_email'),phone:val('p_phone'),address:val('p_addr'),household:val('p_hh'),'former position':val('p_role'),'date affected':val('p_dt'),'amount requested':val('p_amt'),services:[...document.querySelectorAll('.sv:checked')].map(x=>x.value),'previous rent':val('p_rent'),'proof type':val('p_pt'),'proof reference':val('p_pr'),landlord:val('p_ll'),'landlord contact':val('p_lc'),'housing situation':val('p_hs'),hardship:val('p_hd')};
  if(!f.name||!f.email||!f.phone||!f.services.length||!f.hardship||!$('p_ok').checked)return alert('Please complete all required fields (*) and certify.');
  await db.collection('pillar').doc('p'+Date.now()).set({sid,f,st:'Submitted',ts:Date.now(),by:sid=='admin'?'admin':'recipient'});clr();if(sid=='admin'){v.pt='apps';toast('Application saved to records ✔')}else toast('Application sent to the administrator ✔');draw(1)}
init();
</script></body></html>
